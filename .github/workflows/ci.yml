name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate wrapper from trusted Gradle distribution
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Build and test
        run: ./gradlew clean assembleDebug testDebugUnitTest --stacktrace --warning-mode all

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: truth-time-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
