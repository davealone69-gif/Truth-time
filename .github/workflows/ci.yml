name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The committed wrapper JAR has an untrusted checksum. Remove it before
      # Gradle setup and generate a fresh wrapper from the configured Gradle
      # distribution instead of bypassing the problem with the old binary.
      - name: Remove untrusted Gradle wrapper JAR
        run: rm -f gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          validate-wrappers: false

      - name: Configure AndroidX
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Generate clean Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: truth-time-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
