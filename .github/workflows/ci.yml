name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Security gate: there must be no unvalidated wrapper JAR before Gradle setup.
      - name: Validate committed Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AGP 8.8.0 is paired with Gradle 8.10.2.
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate wrapper from trusted Gradle distribution
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      # Validate the newly generated wrapper before it can execute the build.
      - name: Validate generated Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean assembleDebug testDebugUnitTest --stacktrace --warning-mode all

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: truth-time-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
