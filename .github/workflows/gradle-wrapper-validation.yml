name: Validate Gradle Wrapper

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore official Gradle 8.10.2 wrapper JAR if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          expected='2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046'
          # Official location (services.gradle.org does not host the wrapper JAR directly)
          url='https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar'
          curl --fail --location --retry 3 --output gradle/wrapper/gradle-wrapper.jar "$url"
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)"
          test "$actual" = "$expected"
          echo "Verified Gradle 8.10.2 wrapper JAR: $actual"

      - name: Commit official wrapper JAR when repository is missing it
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo 'gradle-wrapper.jar is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/wrapper/gradle-wrapper.jar
          git commit -m 'Add official Gradle 8.10.2 wrapper JAR'
          git push

      - name: Validate Gradle Wrapper checksum
        uses: gradle/actions/wrapper-validation@v6
