# Non-secret project-wide Gradle settings (safe to commit)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required by the Compose/AndroidX dependency graph.
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.incremental=true

# BuildConfig is used by the app module.
android.defaults.buildfeatures.buildconfig=true
